[project]
name = "veillabs-python-sdk"
version = "0.3.0"
description = "Veil Labs Python SDK for private market data and swaps."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Veil Labs", email = "info@veillabs.app"},
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veillabs"]